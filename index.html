
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Vollbild-Modus für Android-Home-Screen (PWA) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kamera Lupe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #222;
      color: white;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }

    /* Kamera-Container nutzt im normalen Modus den Großteil des Bildschirms */
    .camera-container {
      position: relative;
      width: 100%;
      height: 70vh;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease-out; 
    }

    .invert-colors {
      filter: invert(100%);
    }

    /* Kontrollbereich unten */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 15px;
      gap: 12px;
      background-color: #333;
      flex-grow: 1;
    }

    .slider-container {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      gap: 10px;
    }

    input[type=range] {
      flex-grow: 1;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    button {
      flex: 1;
      padding: 12px 10px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }

    #btn-invert {
      background-color: #007bff;
    }

    #btn-fullscreen {
      background-color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="camera-container" id="cam-box">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="controls">
    <div class="slider-container">
      <span>1x</span>
      <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1">
      <span>3x</span>
    </div>
    
    <div class="btn-group">
      <button id="btn-invert">Farben umkehren</button>
      <button id="btn-fullscreen">Vollbild</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const zoomSlider = document.getElementById('zoom-slider');
    const btnInvert = document.getElementById('btn-invert');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    // 1. Kamera starten
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Fehler beim Zugriff auf die Kamera: " + err.message);
      }
    }

    // 2. Zoom-Logik
    zoomSlider.addEventListener('input', (event) => {
      video.style.transform = `scale(${event.target.value})`;
    });

    // 3. Farbumkehr
    btnInvert.addEventListener('click', () => {
      video.classList.toggle('invert-colors');
      btnInvert.style.backgroundColor = video.classList.contains('invert-colors') ? "#dc3545" : "#007bff";
    });

    // 4. Vollbild-Logik
    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        // In den Vollbildmodus wechseln
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) { /* Safari / ältere Browser */
          document.documentElement.webkitRequestFullscreen();
        }
        btnFullscreen.innerText = "Vollbild beenden";
      } else {
        // Vollbild beenden
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        btnFullscreen.innerText = "Vollbild";
      }
    });

    startCamera();
  </script>

</body>
</html>
