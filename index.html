
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kamera Lupe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Kamerabereich nutzt 90% des Bildschirms */
    .camera-container {
      position: relative;
      width: 100%;
      height: 90vh;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.1s ease-out; 
    }

    .invert-colors {
      filter: invert(100%);
    }

    /* Sehr schlanker Kontrollbereich unten (10% der Höhe) */
    .controls {
      height: 10vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 5px 15px;
      gap: 4px;
      background-color: rgba(20, 20, 20, 0.9);
    }

    .slider-container {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      gap: 8px;
      font-size: 0.8rem;
    }

    input[type=range] {
      flex-grow: 1;
      height: 4px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 400px;
    }

    /* Kompakte, kleine Buttons */
    button {
      flex: 1;
      padding: 5px 8px;
      font-size: 0.8rem;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    #btn-invert {
      background-color: #007bff;
    }

    #btn-fullscreen {
      background-color: #495057;
    }
  </style>
</head>
<body>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <div class="controls">
    <div class="slider-container">
      <span>1x</span>
      <input type="range" id="zoom-slider" min="1" max="5" step="0.05" value="1">
      <span>5x</span>
    </div>
    
    <div class="btn-group">
      <button id="btn-invert">Invertieren</button>
      <button id="btn-fullscreen">Vollbild</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const zoomSlider = document.getElementById('zoom-slider');
    const btnInvert = document.getElementById('btn-invert');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Fehler beim Zugriff auf die Kamera: " + err.message);
      }
    }

    zoomSlider.addEventListener('input', (event) => {
      video.style.transform = `scale(${event.target.value})`;
    });

    btnInvert.addEventListener('click', () => {
      video.classList.toggle('invert-colors');
      btnInvert.style.backgroundColor = video.classList.contains('invert-colors') ? "#dc3545" : "#007bff";
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
        btnFullscreen.innerText = "Beenden";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        btnFullscreen.innerText = "Vollbild";
      }
    });

    startCamera();
  </script>

</body>
</html>
