
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kamera Lupe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Container füllt genau den verfügbaren Bildschirmplatz */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .camera-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.1s ease-out; 
    }

    .invert-colors {
      filter: invert(100%);
    }

    /* Kompakter Kontrollbereich am unteren Rand */
    .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 15px 15px 15px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .slider-container {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    input[type=range] {
      flex-grow: 1;
      height: 6px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    button {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }

    #btn-invert {
      background-color: #007bff;
    }

    #btn-fullscreen {
      background-color: #495057;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="camera-container" id="cam-box">
      <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="controls">
      <div class="slider-container">
        <span>1x</span>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.05" value="1">
        <span>5x</span>
      </div>
      
      <div class="btn-group">
        <button id="btn-invert">Invertieren</button>
        <button id="btn-fullscreen">Vollbild</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const zoomSlider = document.getElementById('zoom-slider');
    const btnInvert = document.getElementById('btn-invert');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Fehler beim Zugriff auf die Kamera: " + err.message);
      }
    }

    // Zoom-Logik
    zoomSlider.addEventListener('input', (event) => {
      video.style.transform = `scale(${event.target.value})`;
    });

    // Farbumkehr
    btnInvert.addEventListener('click', () => {
      video.classList.toggle('invert-colors');
      btnInvert.style.backgroundColor = video.classList.contains('invert-colors') ? "#dc3545" : "#007bff";
    });

    // Vollbild umschalten
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
        btnFullscreen.innerText = "Beenden";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        btnFullscreen.innerText = "Vollbild";
      }
    }

    btnFullscreen.addEventListener('click', toggleFullscreen);

    // Automatischer Vollbildmodus beim ersten Tippen irgendwo auf den Bildschirm
    let autoFullscreenDone = false;
    document.addEventListener('click', (e) => {
      if (!autoFullscreenDone && !document.fullscreenElement) {
        toggleFullscreen();
        autoFullscreenDone = true;
      }
    });

    startCamera();
  </script>

</body>
</html>
