
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kamera Lupe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Container füllt genau den verfügbaren Bildschirmplatz.
       100dvh statt 100vh, weil vh auf Mobilgeräten die Höhe inklusive
       der (ein-/ausblendbaren) Adressleiste rechnet — dadurch wurden
       die unteren Buttons vom Browser-UI abgeschnitten. */
    .app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .camera-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.1s ease-out;
    }

    .invert-colors {
      filter: invert(100%);
    }

    /* Kompakter Kontrollbereich am unteren Rand */
    .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 15px calc(15px + env(safe-area-inset-bottom)) 15px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .slider-container {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 400px;
      gap: 10px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    input[type=range] {
      flex-grow: 1;
      height: 6px;
      accent-color: #007bff;
    }

    /* Wird per JS gesetzt, sobald der Zoom über die optische Grenze
       hinaus in den (unschärferen) Digitalzoom-Bereich geht. */
    input[type=range].digital-zoom {
      accent-color: #ff9500;
    }

    #zoom-value {
      min-width: 3.5em;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    button {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btn-invert {
      background-color: #007bff;
    }

    #btn-torch {
      background-color: #6c757d;
    }

    #btn-fullscreen {
      background-color: #495057;
    }

    /* Für Screenreader sichtbar, visuell ausgeblendet */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="camera-container" id="cam-box">
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="controls">
      <div id="zoom-value" aria-hidden="true">1,0x</div>
      <div class="slider-container">
        <span id="zoom-min-label" aria-hidden="true">1x</span>
        <label for="zoom-slider" class="sr-only">Zoomstufe</label>
        <input type="range" id="zoom-slider" min="1" max="5" step="0.05" value="1"
               aria-label="Zoomstufe" aria-valuetext="1x Zoom">
        <span id="zoom-max-label" aria-hidden="true">5x</span>
      </div>

      <div class="btn-group">
        <button id="btn-invert" aria-pressed="false">Invertieren</button>
        <button id="btn-torch" aria-pressed="false" disabled>Licht</button>
        <button id="btn-fullscreen" aria-pressed="false">Vollbild</button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const camBox = document.getElementById('cam-box');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomMinLabel = document.getElementById('zoom-min-label');
    const zoomMaxLabel = document.getElementById('zoom-max-label');
    const zoomValueEl = document.getElementById('zoom-value');
    const btnInvert = document.getElementById('btn-invert');
    const btnTorch = document.getElementById('btn-torch');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    let currentTrack = null;
    let zoomCapable = false;
    let opticalMax = 1; // Grenze, ab der weiterer Zoom nur noch digital (CSS) erfolgt
    let torchOn = false;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            focusMode: "continuous"
          },
          audio: false
        });

        video.srcObject = stream;
        currentTrack = stream.getVideoTracks()[0];
        setupTrackFeatures(currentTrack);
      } catch (err) {
        alert("Fehler beim Zugriff auf die Kamera: " + err.message);
      }
    }

    // Prüft, was die Kamera-Hardware tatsächlich kann (Zoom, Taschenlampe)
    // und richtet die Steuerelemente entsprechend ein.
    function setupTrackFeatures(track) {
      if (typeof track.getCapabilities !== "function") return;
      const caps = track.getCapabilities();

      // Echter optischer/sensorseitiger Zoom statt nur CSS-Skalierung,
      // damit das Bild beim Reinzoomen scharf bleibt.
      if (caps.zoom) {
        zoomCapable = true;
        opticalMax = caps.zoom.max;
        // Slider bewusst über die optische Grenze hinaus verlängern:
        // darüber wird per CSS digital nachvergrößert, damit auch Geräte
        // mit wenig optischem Zoom bis auf hohe Stufen kommen.
        const sliderMax = Math.max(caps.zoom.max, 10);
        zoomSlider.min = caps.zoom.min;
        zoomSlider.max = sliderMax;
        zoomSlider.step = caps.zoom.step || 0.1;
        zoomSlider.value = caps.zoom.min;
        zoomMinLabel.textContent = `${caps.zoom.min}x`;
        zoomMaxLabel.textContent = `${sliderMax}x`;
      } else {
        // Keine Hardware-Zoomstufe verfügbar: der komplette Bereich
        // läuft von Anfang an über den Digitalzoom-Fallback.
        opticalMax = 1;
      }

      if (caps.torch) {
        btnTorch.disabled = false;
      }
    }

    // Zeigt die aktuelle Zoomstufe live an und markiert den Slider farblich,
    // sobald man die optische Grenze verlässt und nur noch digital
    // (unschärfer) weitergezoomt wird.
    function updateZoomDisplay(value, isDigital) {
      zoomValueEl.textContent = `${value.toFixed(1)}x`;
      zoomSlider.setAttribute('aria-valuetext', `${value.toFixed(1)}x Zoom${isDigital ? ' (digital)' : ''}`);
      zoomSlider.classList.toggle('digital-zoom', isDigital);
    }

    // Zoom-Logik: bis zur optischen Grenze echter Kamera-Zoom (scharf),
    // darüber hinaus zusätzlich CSS-Skalierung als Digitalzoom-Fallback.
    zoomSlider.addEventListener('input', async (event) => {
      const value = parseFloat(event.target.value);
      const isDigital = value > opticalMax;

      if (zoomCapable && currentTrack) {
        try {
          const hardwareZoom = Math.min(value, opticalMax);
          await currentTrack.applyConstraints({ advanced: [{ zoom: hardwareZoom }] });
          video.style.transform = isDigital ? `scale(${value / opticalMax})` : 'scale(1)';
        } catch (err) {
          video.style.transform = `scale(${value})`;
        }
      } else {
        video.style.transform = `scale(${value})`;
      }

      updateZoomDisplay(value, isDigital);
    });

    // Farbumkehr
    btnInvert.addEventListener('click', () => {
      const active = video.classList.toggle('invert-colors');
      btnInvert.style.backgroundColor = active ? "#dc3545" : "#007bff";
      btnInvert.setAttribute('aria-pressed', String(active));
    });

    // Taschenlampe
    btnTorch.addEventListener('click', async () => {
      if (!currentTrack) return;
      try {
        torchOn = !torchOn;
        await currentTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
        btnTorch.style.backgroundColor = torchOn ? "#dc3545" : "#6c757d";
        btnTorch.setAttribute('aria-pressed', String(torchOn));
      } catch (err) {
        torchOn = !torchOn; // Zustand zurücksetzen, wenn es fehlschlägt
        alert("Taschenlampe konnte nicht geschaltet werden: " + err.message);
      }
    });

    // Vollbild umschalten
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
        btnFullscreen.innerText = "Beenden";
        btnFullscreen.setAttribute('aria-pressed', 'true');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        btnFullscreen.innerText = "Vollbild";
        btnFullscreen.setAttribute('aria-pressed', 'false');
      }
    }

    btnFullscreen.addEventListener('click', toggleFullscreen);

    // Automatischer Vollbildmodus beim ersten Tippen auf das Kamerabild.
    // Bewusst nur auf cam-box beschränkt, damit ein Tipp auf die
    // Buttons/den Slider nicht versehentlich auch noch Vollbild auslöst.
    let autoFullscreenDone = false;
    camBox.addEventListener('click', () => {
      if (!autoFullscreenDone && !document.fullscreenElement) {
        toggleFullscreen();
        autoFullscreenDone = true;
      }
    });

    // Kamera stoppen, wenn die App in den Hintergrund geht oder
    // die Seite verlassen wird (Akku, Privatsphäre, Kamera-LED).
    function stopCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopCamera();
      } else if (!video.srcObject || !video.srcObject.active) {
        startCamera();
      }
    });

    window.addEventListener('pagehide', stopCamera);

    startCamera();
  </script>
</body>
</html>
