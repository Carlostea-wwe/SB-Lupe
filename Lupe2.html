<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera Lupe</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

.app-container {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

.camera-container {
  flex: 1;
  position: relative;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.1s;
}

/* Zoom Overlay */
#zoom-value {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  background: rgba(0,0,0,0.6);
  padding: 10px 20px;
  border-radius: 10px;
  opacity: 0;
  transition: 0.2s;
}

#zoom-value.visible {
  opacity: 1;
}

/* Controls */
.controls {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 10px;
  background: rgba(0,0,0,0.7);
}

/* Slider */
.slider-container {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Scrollbare Buttons */
.btn-group {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 5px;
}

.btn-group::-webkit-scrollbar {
  height: 6px;
}

.btn-group::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
}

button {
  flex: 0 0 auto;
  padding: 10px;
  font-size: 0.9rem;
  border-radius: 6px;
  border: none;
  color: white;
}

#btn-invert { background: #007bff; }
#btn-contrast { background: #495057; }
#btn-torch { background: #6c757d; }
#btn-fullscreen { background: #495057; }

</style>
</head>

<body>

<div class="app-container">
  <div class="camera-container" id="cam-box">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="zoom-value">1.0x</div>
  </div>

  <div class="controls">

    <div class="slider-container">
      <span>1x</span>
      <input type="range" id="zoom-slider" min="1" max="5" step="0.05" value="1">
      <span>5x</span>
    </div>

    <div class="btn-group">
      <button id="btn-invert">Invert</button>
      <button id="btn-contrast">Kontrast</button>
      <button id="btn-torch" disabled>Licht</button>
      <button id="btn-fullscreen">Vollbild</button>
    </div>

  </div>
</div>

<script>
const video = document.getElementById('webcam');
const zoomSlider = document.getElementById('zoom-slider');
const zoomValue = document.getElementById('zoom-value');

const btnInvert = document.getElementById('btn-invert');
const btnContrast = document.getElementById('btn-contrast');
const btnTorch = document.getElementById('btn-torch');
const btnFullscreen = document.getElementById('btn-fullscreen');

let track = null;
let opticalMax = 1;
let zoomCapable = false;
let torchOn = false;

let invert = false;
let contrast = false;

/* FILTER LOGIK (FIX) */
function updateFilter() {
  let filters = [];

  if (invert) filters.push("invert(100%)");
  if (contrast) filters.push("contrast(300%) brightness(150%)");

  video.style.filter = filters.join(" ");
}

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });

  video.srcObject = stream;
  track = stream.getVideoTracks()[0];

  const caps = track.getCapabilities();

  if (caps.zoom) {
    zoomCapable = true;
    opticalMax = caps.zoom.max;
    zoomSlider.max = Math.max(opticalMax, 10);
  }

  if (caps.torch) {
    btnTorch.disabled = false;
  }
}

/* Zoom */
let timeout;

zoomSlider.addEventListener('input', async (e) => {
  const val = parseFloat(e.target.value);

  zoomValue.textContent = val.toFixed(1) + "x";
  zoomValue.classList.add("visible");

  clearTimeout(timeout);
  timeout = setTimeout(() => {
    zoomValue.classList.remove("visible");
  }, 800);

  if (zoomCapable) {
    await track.applyConstraints({ advanced: [{ zoom: Math.min(val, opticalMax) }] });

    if (val > opticalMax) {
      video.style.transform = `scale(${val / opticalMax})`;
    } else {
      video.style.transform = "scale(1)";
    }
  } else {
    video.style.transform = `scale(${val})`;
  }
});

/* Buttons */

btnInvert.onclick = () => {
  invert = !invert;
  btnInvert.style.background = invert ? "#dc3545" : "#007bff";
  updateFilter();
};

btnContrast.onclick = () => {
  contrast = !contrast;
  btnContrast.style.background = contrast ? "#ffc107" : "#495057";
  updateFilter();
};

btnTorch.onclick = async () => {
  torchOn = !torchOn;
  await track.applyConstraints({ advanced: [{ torch: torchOn }] });
};

btnFullscreen.onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

startCamera();
</script>

</body>
</html>
