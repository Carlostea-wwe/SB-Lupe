<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera Lupe</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: black;
  overflow: hidden;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

.camera {
  flex: 1;
  position: relative;
}

video, canvas {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Canvas versteckt */
canvas {
  display: none;
}

/* Zoom Overlay */
#zoom {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  background: rgba(0,0,0,0.6);
  padding: 10px 20px;
  border-radius: 10px;
  opacity: 0;
}

#zoom.show { opacity: 1; }

.controls {
  position: absolute;
  bottom: 0;
  width: 100%;
  background: rgba(0,0,0,0.7);
  padding: 10px;
}

.btns {
  display: flex;
  gap: 10px;
  overflow-x: auto;
}

button {
  flex: 0 0 auto;
  padding: 10px;
  border: none;
  border-radius: 6px;
  color: white;
}

#invert { background:#007bff; }
#contrast { background:#495057; }
#super { background:#343a40; }

</style>
</head>

<body>

<div class="app">
  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="zoom">1.0x</div>
  </div>

  <div class="controls">
    <input type="range" id="slider" min="1" max="5" step="0.1" value="1">

    <div class="btns">
      <button id="invert">Invert</button>
      <button id="contrast">Kontrast</button>
      <button id="super">Super</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const slider = document.getElementById("slider");
const zoomEl = document.getElementById("zoom");

const btnInvert = document.getElementById("invert");
const btnContrast = document.getElementById("contrast");
const btnSuper = document.getElementById("super");

let invert=false, contrast=false, superMode=false;

/* Kamera */
navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
.then(stream=>{
  video.srcObject = stream;
});

/* Filter (nur Video-Modus) */
function updateFilter(){
  if(superMode) return;

  let f=[];
  if(invert) f.push("invert(100%)");
  if(contrast) f.push("contrast(300%) brightness(150%)");

  video.style.filter=f.join(" ");
}

/* Zoom */
let t;
slider.oninput = ()=>{
  const v=slider.value;
  zoomEl.textContent=v+"x";
  zoomEl.classList.add("show");

  clearTimeout(t);
  t=setTimeout(()=>zoomEl.classList.remove("show"),800);

  video.style.transform=`scale(${v})`;
  canvas.style.transform=`scale(${v})`;
};

/* Buttons */
btnInvert.onclick=()=>{
  invert=!invert;
  btnInvert.style.background=invert?"#dc3545":"#007bff";
  updateFilter();
};

btnContrast.onclick=()=>{
  contrast=!contrast;
  btnContrast.style.background=contrast?"#ffc107":"#495057";
  updateFilter();
};

btnSuper.onclick=()=>{
  superMode=!superMode;
  btnSuper.style.background=superMode?"#17a2b8":"#343a40";

  if(superMode){
    video.style.display="none";
    canvas.style.display="block";
    process();
  } else {
    video.style.display="block";
    canvas.style.display="none";
  }
};

/* Sobel Edge Detection */
function process(){
  if(!superMode) return;

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  ctx.drawImage(video,0,0);

  const frame = ctx.getImageData(0,0,canvas.width,canvas.height);
  const data = frame.data;

  const w = canvas.width;
  const h = canvas.height;

  const gray = new Uint8ClampedArray(w*h);

  // Graustufen
  for(let i=0;i<w*h;i++){
    const r=data[i*4];
    const g=data[i*4+1];
    const b=data[i*4+2];
    gray[i]=0.299*r+0.587*g+0.114*b;
  }

  // Sobel
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=y*w+x;

      const gx =
        -gray[i-w-1] -2*gray[i-1] -gray[i+w-1] +
         gray[i-w+1] +2*gray[i+1] +gray[i+w+1];

      const gy =
        -gray[i-w-1] -2*gray[i-w] -gray[i-w+1] +
         gray[i+w-1] +2*gray[i+w] +gray[i+w+1];

      const mag = Math.sqrt(gx*gx+gy*gy);

      const val = mag > 100 ? 255 : 0;

      const idx=i*4;
      data[idx]=data[idx+1]=data[idx+2]=val;
    }
  }

  ctx.putImageData(frame,0,0);

  requestAnimationFrame(process);
}
</script>

</body>
</html>
